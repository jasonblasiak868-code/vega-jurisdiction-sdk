[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-jurisdiction-sdk"
version = "0.1.0"
description = "Jurisdictional protocol keys: three branch keys per jurisdiction, 2-of-3 policy, the People's Veto, and the Kronos root that no operator can change alone."
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "vega-custody-sdk", "vega-governance-jacket-sdk"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
